<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#24251f" />
    <meta name="description" content="부천 원미동 동네 서점 비북스의 3D 공간. 아바타로 들어와 함께 앉아 각자의 책을 읽습니다." />
    <title>비북스 · 원미서가</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="비북스" />
  </head>
  <body>
    <div id="stage">
      <canvas id="scene" role="img" aria-label="비 오는 오후의 작은 동네 서점 비북스 실내. 벽마다 책이 꽂힌 나무 서가, 창가 독서 테이블, 소파와 스탠드 조명이 있다."></canvas>
    </div>

    <section id="start" class="screen start" aria-labelledby="start-title">
      <div class="start-inner">
        <p class="start-kicker">부천 원미동 동네 서점</p>
        <h1 id="start-title" class="start-title">비북스</h1>
        <p class="start-room" id="start-room">원미서가</p>
        <p class="start-note" id="start-note">한 번에 20명까지</p>
        <p class="start-copy">비 오는 오후, 서점 한쪽에 앉아<br />각자의 책을 함께 읽어요.</p>
        <button id="start-enter" class="start-enter" type="button" aria-label="서점에 들어가기">들어가기</button>
      </div>
    </section>

    <section id="loading" class="screen loading" aria-live="polite" hidden>
      <div class="loading-inner">
        <p class="loading-title">서점 문을 여는 중</p>
        <div class="loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="불러오는 중">
          <div class="loading-fill" id="loading-fill"></div>
        </div>
        <p class="loading-step" id="loading-step">준비하는 중</p>
      </div>
    </section>

    <section id="full" class="screen" hidden aria-labelledby="full-title">
      <div class="start-inner">
        <p class="start-kicker">비북스</p>
        <h1 id="full-title" class="start-title">자리가 가득 찼어요</h1>
        <p class="start-copy" id="full-copy">지금은 20명이 모두 모였어요.<br />누군가 나가면 다시 들어올 수 있어요.</p>
        <button id="full-back" class="start-enter" type="button">첫 화면으로</button>
      </div>
    </section>

    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
