<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1612" />
    <meta name="description" content="부천 원미동 동네책방 비북스의 3D 공간. 서점 한 켠에서 각자의 책을 함께 읽어요." />
    <title>비북스 · 부천 원미동</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="비북스" />
  </head>
  <body>
    <div id="stage">
      <canvas id="scene" role="img" aria-label="부천 원미동 동네책방 비북스 실내. 벽마다 책이 꽂힌 나무 서가와 독서 테이블이 있다."></canvas>
    </div>

    <section id="start" class="screen start" aria-labelledby="start-title">
      <div class="start-wall" aria-hidden="true"></div>
      <div class="start-stage">
        <div class="start-doorway" aria-hidden="true">
          <div class="start-glow"></div>
          <div class="start-door-art">
            <div class="start-leaf start-leaf-l"></div>
            <div class="start-leaf start-leaf-r"></div>
          </div>
        </div>

        <div class="start-words">
          <h1 id="start-title" class="start-title">부천 원미동 비북스</h1>
          <p class="start-copy">서점 한 켠에서 각자의 책을 함께 읽어요</p>
          <button id="start-enter" class="start-enter" type="button" aria-label="책방 입장하기">책방 입장하기</button>
        </div>
      </div>
    </section>

    <section id="loading" class="screen loading" aria-live="polite" hidden>
      <div class="loading-inner">
        <p class="loading-title">서점 문을 여는 중</p>
        <div class="loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="불러오는 중">
          <div class="loading-fill" id="loading-fill"></div>
        </div>
        <p class="loading-step" id="loading-step">준비하는 중</p>
      </div>
    </section>

    <section id="full" class="screen full" hidden aria-labelledby="full-title">
      <div class="full-inner">
        <p class="full-kicker">비북스</p>
        <h1 id="full-title" class="full-title">자리가 가득 찼어요</h1>
        <p class="full-copy" id="full-copy">지금은 20명이 모두 모였어요.<br />누군가 나가면 다시 들어올 수 있어요.</p>
        <button id="full-back" class="start-enter" type="button">첫 화면으로</button>
      </div>
    </section>

    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
